name: Backend CI

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-integration:
    name: Build, test, and verify API
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: people_sync_test
          MYSQL_USER: people_sync_ci
          MYSQL_PASSWORD: ci-test-only-password
          MYSQL_ROOT_PASSWORD: ci-root-test-only-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --user=people_sync_ci --password=ci-test-only-password"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    defaults:
      run:
        working-directory: backend
        shell: bash

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "3306"
      DB_NAME: people_sync_test
      DB_USERNAME: people_sync_ci
      DB_PASSWORD: ci-test-only-password
      DB_USE_SSL: "false"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Node.js for Newman
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Newman
        run: npm install --global newman@6.2.1

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Install backend dependencies
        run: ./gradlew --no-daemon dependencies

      - name: Run backend unit and repository tests
        run: ./gradlew --no-daemon clean test

      - name: Build executable backend artifact
        run: ./gradlew --no-daemon bootJar

      - name: Run MySQL migration and API integration checks
        run: |
          set -Eeuo pipefail
          mkdir -p build/ci-evidence
          ./gradlew --no-daemon bootRun > build/ci-evidence/api.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT

          api_ready=false
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:8080/api/v1/departments > build/ci-evidence/departments.json; then
              api_ready=true
              break
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              cat build/ci-evidence/api.log
              exit 1
            fi
            sleep 2
          done

          if [[ "$api_ready" != "true" ]]; then
            cat build/ci-evidence/api.log
            exit 1
          fi

          curl --fail --silent --show-error \
            "http://127.0.0.1:8080/api/v1/employees?page=1&pageSize=20&sort=joiningDate&direction=desc" \
            > build/ci-evidence/employees.json

          newman run postman/people-sync-api.postman_collection.json \
            --environment postman/people-sync-ci.postman_environment.json \
            --bail \
            --color off \
            --reporters cli,junit,json \
            --reporter-junit-export build/ci-evidence/newman-results.xml \
            --reporter-json-export build/ci-evidence/newman-results.json

      - name: Upload backend test results and API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-results-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            backend/build/reports/tests/
            backend/build/test-results/
            backend/build/ci-evidence/

      - name: Upload backend application artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: backend/build/libs/*.jar
