name: Frontend CI

on:
  push:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-e2e:
    name: Build, test, and run browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend
        shell: bash

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.22.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend unit and component tests
        run: |
          mkdir -p test-results/vitest
          npm run test:ci

      - name: Build production frontend
        run: npm run build

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run critical Playwright user journeys
        env:
          CI: "true"
        run: npm run test:e2e -- --grep @critical

      - name: Upload frontend test and failure evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-results-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            frontend/test-results/
            frontend/playwright-report/

      - name: Upload production frontend artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-${{ github.run_id }}
          if-no-files-found: error
          retention-days: 14
          path: frontend/dist/
